defaults:
  - model/encoder: vggt
  - model/decoder: splatting_cuda
  - loss: [mse]

wandb:
  project: t4gs
  name: t4gs_train
  mode: disabled

mode: train

force_davis_intrinsics: false

data_loader:
  train:
    num_workers: 16
    persistent_workers: true
    batch_size: 2
    seed: 1234
  test:
    num_workers: 4
    persistent_workers: false
    batch_size: 1
    seed: 2345
  val:
    num_workers: 1
    persistent_workers: true
    batch_size: 1
    seed: 3456

optimizer:
  lr: 1.5e-4
  warm_up_steps: 2000
  backbone_lr_multiplier: 0.1

checkpointing:
  load: null
  every_n_train_steps: 5000
  save_top_k: 1
  save_weights_only: false

train:
  depth_mode: null
  extended_visualization: false
  print_log_every_n_steps: 10
  # Lossless INRIA/SuperSplat PLY sequence export for selected validation samples.
  # The existing validation frequency and sampling policy still control when it runs.
  save_gaussian_sequence: false
  gaussian_sequence_output_path: null

test:
  output_path: outputs/test
  align_pose: false
  pose_align_steps: 100
  rot_opt_lr:  0.005
  trans_opt_lr:  0.005
  compute_scores: false
  save_image: true
  save_video: false
  save_compare: false

seed: 111123

trainer:
  max_steps: -1
  val_check_interval: 250
  gradient_clip_val: 0.5
  num_nodes: 1
  num_sanity_val_steps: 2

hydra:
  run:
    dir: outputs/exp_${wandb.name}/${now:%Y-%m-%d_%H-%M-%S}
